workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "push"'

stages:
  - test
  - quality
  - build

default:
  tags:
    - windows-local

unit_tests:
  stage: test
  script:
    - py -3.13 -m pip install -r requirements.txt -r requirements-dev.txt
    - py -3.13 -m pytest -q

code_quality:
  stage: quality
  script:
    - py -3.13 -m pip install ruff
    - py -3.13 -m ruff check lending.py clients/ services/ tests/

compose_validation:
  stage: quality
  script:
    - docker compose config --quiet

build_web:
  stage: build
  script:
    - docker build --file Dockerfile --tag equipment-lending-web:ci .

build_equipment:
  stage: build
  script:
    - docker build --file services/equipment_service/Dockerfile --tag equipment-lending-equipment:ci .

build_loan:
  stage: build
  script:
    - docker build --file services/loan_service/Dockerfile --tag equipment-lending-loan:ci .
