workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "push"'
stages:
  - test
  - quality
  - build

unit_tests:
  stage: test
  tags:
    - windows-local
  script:
    - py -3.13 -m venv .ci-venv
    - .\.ci-venv\Scripts\python.exe -m pip install -r requirements.txt
    - .\.ci-venv\Scripts\python.exe -m pip install pytest httpx
    - .\.ci-venv\Scripts\python.exe -m pytest -v --junitxml=pytest-report.xml
  artifacts:
    when: always
    reports:
      junit: pytest-report.xml
    paths:
      - pytest-report.xml

code_quality:
  stage: quality
  tags:
    - windows-local
  script:
    - py -3.13 -m venv .ci-venv
    - .\.ci-venv\Scripts\python.exe -m pip install ruff
    - .\.ci-venv\Scripts\python.exe -m ruff check lending.py tests/
  needs: []

docker_build:
  stage: build
  tags:
    - windows-local 
  script:
    - docker info
    - docker build -t equipment-lending:$env:CI_COMMIT_SHORT_SHA .
  needs: []
