name: Microservices CI

on:
  push:
    branches: [main, microservices-cleanup, microservices]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit_tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install 'pytest>=8,<10' 'httpx>=0.27,<1'
      - name: Run microservice and frontend tests
        run: python -m pytest -v tests/test_web_frontend.py tests/test_equipment_service.py tests/test_loan_service.py

  code_quality:
    name: Ruff code quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Ruff
        run: python -m pip install ruff
      - name: Check Python source and tests
        run: python -m ruff check web/ clients/ services/ messaging/ tests/

  compose_validation:
    name: Docker Compose validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose configuration
        run: docker compose config --quiet

  docker_build:
    name: Build ${{ matrix.service }} image
    runs-on: ubuntu-latest
    needs: [unit_tests, code_quality, compose_validation]
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: web
            dockerfile: Dockerfile
          - service: equipment
            dockerfile: services/equipment_service/Dockerfile
          - service: loan
            dockerfile: services/loan_service/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build --file "${{ matrix.dockerfile }}" --tag "equipment-lending-${{ matrix.service }}:ci" .
