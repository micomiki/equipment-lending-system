
server {
    listen 8080;
    server_name _;

    # Equipment Microservice
    location /equipment {
        proxy_pass http://equipment:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Loan Microservice
    location /loans {
        proxy_pass http://loan:8002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Gateway health check
    location = /health {
        default_type application/json;
        return 200 '{"status":"healthy","service":"gateway"}';
    }

    location / {
        return 404;
    }
}
